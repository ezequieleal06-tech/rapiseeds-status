owner: ezequieleal06-tech
repo: rapiseeds-status

# Cada cuanto corre cada tarea.
# El default de Upptime es revisar cada 5 minutos, pero GitHub recorta las tareas
# programadas de las cuentas gratuitas cuando hay carga, y las que piden cada 5
# minutos son las primeras que saltea: en la practica corria cada 2 o 3 horas y
# alguna quedaba encolada hasta que la cancelaban (mail "All jobs were cancelled").
# Pidiendo cada 15 minutos GitHub la deja pasar y los chequeos salen parejos.
workflowSchedule:
  uptime: "*/15 * * * *"

sites:
  - name: RapiSeeds Web
    url: https://rapiseeds.com
  - name: RapiSeeds www
    url: https://www.rapiseeds.com
  - name: Supabase API
    url: https://abpasdyraaihdysvexiw.supabase.co/rest/v1/
    expectedStatusCodes:
      - 200
      - 401
  - name: n8n Webhooks
    url: https://n8ntesting.online
    expectedStatusCodes:
      - 200
      - 404

status-website:
  cname: status.rapiseeds.com
  baseUrl: /
  logoUrl: https://rapiseeds.com/logo-main.webp
  name: RapiSeeds Status
  introTitle: "**Estado de RapiSeeds**"
  introMessage: Monitoreo automatico de uptime. Si la web esta caida, vas a verlo aca.
  navbar:
    - title: Status
      href: /

user:
  name: RapiSeeds
  email: ezequielgarcialeal06@gmail.com

assignees:
  - ezequieleal06-tech

i18n:
  activeIncidents: Incidentes activos
  allSystemsOperational: Todos los sistemas operativos
  incidentReport: "Reporte completo:"
  noIncidents: Sin incidentes reportados
  ongoingIncidents: Incidentes en curso
  pastIncidents: Incidentes anteriores
  partialOutage: Caida parcial
  status: Estado
  url: URL
  responseTime: Tiempo de respuesta
  uptime: Uptime

notifications:
  - type: webhook
    webhookUrl: $UPTIME_WEBHOOK_URL
